name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services: 
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youtube_triage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:                          
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run linters
        run: ruff check src/

      - name: Run type checker
        run: mypy src/

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-fail-under=60
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youtube_triage_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/youtube_triage_test
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}